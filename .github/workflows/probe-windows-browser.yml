name: R313 published old-client detection diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  published-client-detection:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download and verify exact published 0.13.1 client
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/r313-baseline" | Out-Null
          gh release download v0.13.1 --pattern '*public.exe' --dir "$env:RUNNER_TEMP/r313-baseline"
          if ($LASTEXITCODE -ne 0) { throw 'baseline download failed' }
          $setup=(Get-ChildItem "$env:RUNNER_TEMP/r313-baseline/*.exe").FullName
          if ((Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant() -ne '8fe9918103f2de7d15868bc7db724041033960b0f61bfbe88e6d2fac539681ca') { throw 'baseline digest mismatch' }
      - name: Actual installed 0.13.1 detects published 0.13.2
        shell: pwsh
        run: ./scripts/r313-published-check.ps1 -Setup (Get-ChildItem "$env:RUNNER_TEMP/r313-baseline/*.exe").FullName -Output "$env:RUNNER_TEMP/r313-published-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r313-published-client-${{ github.run_id }}
          path: ${{ runner.temp }}/r313-published-evidence/**
          if-no-files-found: error
