name: R313 Windows upgrade timing diagnostic
on:
  push:
    branches: [codex/diagnostic-r279-r313-upgrade]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-timing:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download exact published baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/r313/baseline" | Out-Null
          gh release download v0.13.1 --pattern '*public.exe' --dir "$env:RUNNER_TEMP/r313/baseline"
          if ($LASTEXITCODE -ne 0) { throw 'baseline download failed' }
      - name: Published baseline fifteen real window samples
        shell: pwsh
        run: ./scripts/r313-upgrade-window.ps1 -Setup (Get-ChildItem "$env:RUNNER_TEMP/r313/baseline/*.exe").FullName -Output "$env:RUNNER_TEMP/r313/published"
      - name: Build candidate with real embedded payload
        shell: pwsh
        run: |
          $version = node -p "require('./desktop/package.json').version"
          $cipher = (& go run ./backend -encrypt-riot-key 'RGAPI-00000000-0000-0000-0000-000000000000').Trim()
          if ($LASTEXITCODE -ne 0 -or -not $cipher) { throw 'fake cipher failed' }
          ./build-desktop-windows.ps1 -Version $version -KeyMode public -SkipTestsInCI -RiotAPIKeyCipher $cipher
          if ($LASTEXITCODE -ne 0) { throw 'candidate build failed' }
      - name: Candidate fifteen real window samples
        shell: pwsh
        run: |
          $version=node -p "require('./desktop/package.json').version"
          ./scripts/r313-upgrade-window.ps1 -Setup "dist/desktop/Deep Legends Setup $version-public.exe" -Output "$env:RUNNER_TEMP/r313/candidate" -Enforce
      - name: Real 112MB apply endpoint hash and cache timing
        shell: pwsh
        run: |
          $env:R313_SETUP_FILE=(Get-ChildItem "$env:RUNNER_TEMP/r313/baseline/*.exe").FullName
          go test ./backend -run TestR313RealPackageApplyEndpointTiming -count=1 -v | Tee-Object "$env:RUNNER_TEMP/r313/apply-timing.log"
          if ($LASTEXITCODE -ne 0) { throw 'apply endpoint timing failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r313-upgrade-timing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r313/**
          if-no-files-found: error
