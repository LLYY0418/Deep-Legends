name: quality-and-windows-release

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      measure_windows_renderers:
        description: "R222 acceptance: run full desktop tests once on Windows and record budgets"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify local notes and assistant instructions are not tracked
        run: node scripts/verify-no-docs-tracked.cjs
      - name: Prepare verified published update compatibility input
        run: node scripts/prepare-r238-update-fixture.cjs
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(find . -type d \( -name '.*' ! -name . -o -name node_modules -o -name vendor -o -name dist \) -prune -o -type f -name '*.go' -print0 | xargs -0 gofmt -l)"
          test -z "$unformatted"
      - name: Vet
        run: go vet ./...
      - name: Verify release license isolation
        shell: bash
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags= -buildvcs=false -o "$RUNNER_TEMP/r233-release-public.exe" ./backend
          node desktop/verify-license-release.cjs "$RUNNER_TEMP/r233-release-public.exe"
      - name: R252 compile shelved license code and verify corrected fixtures
        run: node scripts/r252-license-check.cjs
      - name: Verify CI test filters
        run: node scripts/verify-ci-test-filters.cjs
      - name: Test with race detector
        run: go test -count=1 -race ./...
      - name: Validate frontend JavaScript
        run: |
          node --check backend/web/app.js
          node --check backend/web/suite.js
          node --check desktop/main.cjs
      - name: Install desktop test dependencies
        run: npm ci --prefix desktop
      # Option B: measure this runner's speed with a fixed jsdom workload before
      # and after the suite, so the 192s margin is judged at reference speed.
      - name: Calibrate runner speed before renderers
        run: node scripts/runner-calibration.cjs "$RUNNER_TEMP/runner-calibration-before.json"
      - name: Test frontend and desktop renderers
        env:
          R222_NODE_TIMING_OUTPUT: ${{ runner.temp }}/renderer-timings-linux.json
        run: node scripts/test-renderers.cjs all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-timings-linux
          path: ${{ runner.temp }}/renderer-timings-linux.json
      - name: Calibrate runner speed after renderers
        run: node scripts/runner-calibration.cjs "$RUNNER_TEMP/runner-calibration-after.json"
      - name: Enforce R252 renderer budget margin
        run: node scripts/renderer-budget-gate.cjs "$RUNNER_TEMP/renderer-timings-linux.json" "$RUNNER_TEMP/runner-calibration-before.json" "$RUNNER_TEMP/runner-calibration-after.json" "$RUNNER_TEMP/renderer-budget-gate.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-budget-gate-linux
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/runner-calibration-before.json
            ${{ runner.temp }}/runner-calibration-after.json
            ${{ runner.temp }}/renderer-budget-gate.json
      - name: Test Riot relay Worker
        run: node --test relay/riot-worker/*.test.mjs
      # P1-2：这两个脚本以前从不在任何流程里执行，护栏失效了半年没人发现。
      # 找不到浏览器时直接失败，不允许静默跳过。
      - name: Real Chromium image-queue and lazy-CSS guards
        run: |
          chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          test -n "$chrome" || { echo "no Chrome/Chromium binary on the runner; browser guards must not silently skip" >&2; exit 1; }
          echo "using $chrome"
          CHROME_BIN="$chrome" R100_BROWSER_OUTPUT="$RUNNER_TEMP/r100-browser" node desktop/r100-browser.cjs
          CHROME_BIN="$chrome" R117_BROWSER_OUTPUT="$RUNNER_TEMP/r117-browser" node desktop/r117-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-guards-linux
          path: |
            ${{ runner.temp }}/r100-browser/**
            ${{ runner.temp }}/r117-browser/**
          if-no-files-found: warn
      - name: Test installer module
        working-directory: installer
        run: go test ./...
      - name: Vet installer module
        working-directory: installer
        run: go vet ./...

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: R261 normal-close window bounds regression and assertion mutation
        shell: pwsh
        run: ./scripts/r261-window-bounds.test.ps1
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Verify local notes and assistant instructions are not tracked
        run: node scripts/verify-no-docs-tracked.cjs
      - name: Prepare verified published update compatibility input
        run: node scripts/prepare-r238-update-fixture.cjs
      - name: Install Windows test dependencies
        run: npm ci --prefix desktop
      # Audit unchanged production source on the fresh native runtime, before
      # Go/build fixtures create processes and replace npm dependencies.
      - name: Real default Electron first-frame license absence audit
        shell: pwsh
        env:
          R248_ELECTRON_OUTPUT: ${{ runner.temp }}/deep-legends-r238-default-electron
        run: |
          node -e "require('./scripts/r248-electron.cjs').probe({phase:'after',state:'DISABLED',frontendAssetDirectory:'default',storedBounds:{x:40,y:40,width:1050,height:750,maximized:false}}).then(r=>console.log(JSON.stringify(r.shows))).catch(e=>{console.error(e);process.exitCode=1})"
          if ($LASTEXITCODE -ne 0) { throw "Default first-frame audit failed" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r238-default-electron-windows
          path: ${{ runner.temp }}/deep-legends-r238-default-electron/**
      # R225: restore all Windows-compiled shared paths, not only Linux skips.
      # Includes TestUpdate*, TestR204KeySaveAndClear, TestR204KeyRuntime401AndPrivacy
      # and TestSplitRegistryPathSupportsNativeTencentKeys. JSON proves actual passes.
      - name: Test full Windows backend and installer suites
        shell: pwsh
        run: |
          node scripts/run-ci-tests.cjs go backend
          if ($LASTEXITCODE -ne 0) { throw "Windows backend tests or pass inventory failed" }
          node scripts/run-ci-tests.cjs go installer
          if ($LASTEXITCODE -ne 0) { throw "Windows installer tests or pass inventory failed" }
      - name: R252 thirty independent R104 cold-start timelines
        shell: pwsh
        run: |
          go test -c -o "$env:RUNNER_TEMP/r252-r104.test.exe" ./backend
          if ($LASTEXITCODE -ne 0) { throw "R104 soak compilation failed" }
          python scripts/r252-r104-soak.py --binary "$env:RUNNER_TEMP/r252-r104.test.exe" --output "$env:RUNNER_TEMP/r252-r104-windows" --iterations 30
          if ($LASTEXITCODE -ne 0) { throw "R104 soak failure; original timelines retained" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r252-r104-windows
          path: ${{ runner.temp }}/r252-r104-windows/**
      - name: R252 native diagnostic timestamp regression and assertion mutation
        shell: pwsh
        run: ./scripts/r252-diagnostic-time.test.ps1
      # Filtered platform gates must match their exact counts with zero skips.
      - name: Test Windows-only release and PowerShell guards
        shell: pwsh
        env:
          R82_POWERSHELL: powershell.exe
        run: |
          node scripts/run-ci-tests.cjs node --expected-tests=2 --test-name-pattern="R86 Windows release|R222 Windows" desktop/release-quality-gates.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "Windows release gates failed" }
          node scripts/run-ci-tests.cjs node --expected-tests=1 --test-name-pattern="setup-only Windows CI skip" scripts/setup-only-build.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "Windows setup-only guards failed" }
          node scripts/run-ci-tests.cjs node --expected-tests=2 scripts/r82-startup-ab-script.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "PowerShell script guards failed" }
      # Opt-in acceptance only; routine tag/build runs rely on Linux's full suite.
      - name: Measure full desktop renderer tests on Windows
        if: github.event_name == 'workflow_dispatch' && inputs.measure_windows_renderers
        shell: pwsh
        env:
          R222_NODE_TIMING_OUTPUT: ${{ runner.temp }}/renderer-timings-windows.json
        run: |
          node scripts/test-renderers.cjs desktop
          if ($LASTEXITCODE -ne 0) { throw "Windows renderer test or time budget failed" }
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.measure_windows_renderers
        with:
          name: renderer-timings-windows
          path: ${{ runner.temp }}/renderer-timings-windows.json
      - name: Build desktop client and checksums
        shell: pwsh
        run: |
          $version = node -p "require('./desktop/package.json').version"
          if ($LASTEXITCODE -ne 0) { throw "Unable to read desktop package version" }
          ./build-desktop-windows.ps1 -Version $version -KeyMode public -SkipTestsInCI
          if ($LASTEXITCODE -ne 0) { throw "Desktop build failed" }
      - name: Verify checksums
        shell: pwsh
        run: |
          Get-Content dist/desktop/SHA256SUMS-public.txt | ForEach-Object {
            $parts = $_ -split '  ', 2
            $actual = (Get-FileHash -Algorithm SHA256 (Join-Path dist/desktop $parts[1])).Hash.ToLowerInvariant()
            if ($actual -ne $parts[0]) { throw "Checksum mismatch: $($parts[1])" }
          }
      - name: Real 0.12.65/0.12.68/0.12.76 installation and candidate upgrade
        shell: pwsh
        run: |
          $version = node -p "require('./desktop/package.json').version"
          ./scripts/r206-real-upgrade-windows.ps1 -Setup "dist/desktop/Deep Legends Setup $version-public.exe"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r206-real-upgrade-evidence
          path: ${{ runner.temp }}/deep-legends-r206-real-upgrade/evidence/*
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: deep-legends-windows-x64
          path: |
            dist/desktop/*.exe
            dist/desktop/*.zip
            dist/desktop/SHA256SUMS-public.txt
          if-no-files-found: error
