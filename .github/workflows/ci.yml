name: quality-and-windows-release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check formatting
        shell: bash
        run: |
          test -z "$(find . -type d \( -name .git -o -name .gomodcache -o -name .gocache -o -name .tmpbuild -o -name node_modules \) -prune -o -type f -name '*.go' -print0 | xargs -0 gofmt -l)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Validate frontend JavaScript
        run: |
          node --check web/app.js
          node --check web/suite.js
          node --check desktop/main.cjs
      - name: Install desktop test dependencies
        run: npm ci --prefix desktop
      - name: Test frontend and desktop renderers
        run: node --test web/*.test.cjs desktop/*.test.cjs
      - name: Test installer module
        working-directory: installer
        run: go test ./...
      - name: Vet installer module
        working-directory: installer
        run: go vet ./...
      - name: Verify embedded pool
        run: go test -run 'TestEmbeddedPoolHas554UniqueEntries|TestEmbeddedPoolMapsOneToOneWithoutOmissions' ./...

  windows-build:
    runs-on: windows-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Windows test dependencies
        run: npm ci --prefix desktop
      - name: Build desktop client and checksums
        shell: pwsh
        run: |
          $version = node -p "require('./desktop/package.json').version"
          if ($LASTEXITCODE -ne 0) { throw "Unable to read desktop package version" }
          ./build-desktop-windows.ps1 -Version $version -KeyMode public
          if ($LASTEXITCODE -ne 0) { throw "Desktop build failed" }
      - name: Verify checksums
        shell: pwsh
        run: |
          Get-Content dist/desktop/SHA256SUMS.txt | ForEach-Object {
            $parts = $_ -split '  ', 2
            $actual = (Get-FileHash -Algorithm SHA256 (Join-Path dist/desktop $parts[1])).Hash.ToLowerInvariant()
            if ($actual -ne $parts[0]) { throw "Checksum mismatch: $($parts[1])" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: deep-legends-windows-x64
          path: |
            dist/desktop/*.exe
            dist/desktop/*.zip
            dist/desktop/SHA256SUMS.txt
          if-no-files-found: error
