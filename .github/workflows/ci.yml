name: quality-and-windows-release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Validate frontend JavaScript
        run: |
          node --check web/app.js
          node --test web/remaining-sort.test.cjs
          node --check desktop/main.cjs
      - name: Verify embedded pool
        run: go test -run 'TestEmbeddedPoolHas554UniqueEntries|TestEmbeddedPoolMapsOneToOneWithoutOmissions' ./...

  windows-build:
    runs-on: windows-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Build desktop client and checksums
        shell: pwsh
        run: ./build-desktop-windows.ps1 -Version "0.11.0"
      - name: Verify checksums
        shell: pwsh
        run: |
          Get-Content dist/desktop/SHA256SUMS.txt | ForEach-Object {
            $parts = $_ -split '  ', 2
            $actual = (Get-FileHash -Algorithm SHA256 (Join-Path dist/desktop $parts[1])).Hash.ToLowerInvariant()
            if ($actual -ne $parts[0]) { throw "Checksum mismatch: $($parts[1])" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: deep-legends-windows-x64
          path: |
            dist/desktop/*.exe
            dist/desktop/*.zip
            dist/desktop/SHA256SUMS.txt
          if-no-files-found: error
