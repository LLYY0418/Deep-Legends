name: quality-and-windows-release

on:
  push:
    tags-ignore: ['v*']
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      measure_windows_renderers:
        description: "R222 acceptance: run full desktop tests once on Windows and record budgets"
        type: boolean
        default: true

permissions:
  contents: read

# R279: a newer push to a codex/probe-* branch cancels the run it supersedes. Every other ref (main, release
# branches, pull requests, dispatches elsewhere) gets a group unique to the run, so nothing else is ever cancelled or queued.
concurrency:
  group: ${{ startsWith(github.ref, 'refs/heads/codex/probe-') && format('probe-{0}', github.ref) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/codex/probe-') }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install quality fixture Node dependencies
        run: npm ci --prefix desktop
      - name: Verify local notes and assistant instructions are not tracked
        run: node scripts/verify-no-docs-tracked.cjs
      - name: Prepare verified published update compatibility input
        run: node scripts/prepare-r238-update-fixture.cjs
      - name: Prepare Go dependencies before offline tests
        run: go mod download
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(find . -type d \( -name '.*' ! -name . -o -name node_modules -o -name vendor -o -name dist \) -prune -o -type f -name '*.go' -print0 | xargs -0 gofmt -l)"
          test -z "$unformatted"
      - name: Audit captured writes in test callbacks
        run: go run ./scripts/check-test-captures --json="$RUNNER_TEMP/test-capture-audit.json"
      - name: R276 deterministic fixture and audit mutations
        run: python3 scripts/r276-fixture-mutations.py --out "$RUNNER_TEMP/r276-fixture-mutations"
      - name: R276 complete Hexdata restart barrier mutations
        run: python3 scripts/r276-hexdata-mutations.py --out "$RUNNER_TEMP/r276-hexdata-mutations"
      - name: R276 exact published legacy installer retry regression and mutations
        run: python3 scripts/r276-legacy-installer-retry-mutations.py --out "$RUNNER_TEMP/r276-legacy-installer-retry-mutations"
      - name: R276 native installed port-owner regression and mutations
        run: node scripts/r276-port-owner-mutations.cjs "$RUNNER_TEMP/r276-port-owner-mutations"
      - name: R276 bounded offline PowerShell fixture diagnostics
        run: node scripts/r276-powershell-fixture-mutations.cjs "$RUNNER_TEMP/r276-powershell-fixture-mutations"
      - name: R276 fresh renderer fixture isolation regression and mutations
        run: node scripts/r276-fresh-chrome-mutations.cjs "$RUNNER_TEMP/r276-fresh-chrome-mutations"
      - name: R276 recovery scope fixture regression and mutation
        run: python3 scripts/r276-recovery-scope-mutations.py --out "$RUNNER_TEMP/r276-recovery-scope-mutations"
      - name: R276 translation timeout fixture regression and mutation
        run: python3 scripts/r276-translation-fixture-mutations.py --out "$RUNNER_TEMP/r276-translation-fixture-mutations"
      - name: R276 installed demo startup navigation regression and mutations
        run: node scripts/r276-installed-demo-mutations.cjs "$RUNNER_TEMP/r276-installed-demo-mutations"
      - name: Audit browser process and directory cleanup
        run: node scripts/check-browser-cleanup.cjs --json="$RUNNER_TEMP/browser-cleanup-audit.json"
      - name: R276 deterministic cleanup regression and mutations
        run: node scripts/r276-cleanup-mutations.cjs "$RUNNER_TEMP/r276-cleanup-mutations"
      - name: R276 precise API fault policy regression and mutations
        run: node scripts/r276-api-policy-mutations.cjs "$RUNNER_TEMP/r276-api-policy-mutations"
      - name: R276 default-timeout stress partition regression and mutations
        run: node scripts/r276-hexdata-stress-mutations.cjs "$RUNNER_TEMP/r276-hexdata-stress-mutations"
      - name: R276 filter geometry fixture regression and mutation
        run: node scripts/r276-filter-geometry-mutations.cjs "$RUNNER_TEMP/r276-filter-geometry-mutations"
      - name: R276 canceled update-probe fixture regression and mutation
        run: python3 scripts/r276-update-probe-mutations.py --out "$RUNNER_TEMP/r276-update-probe-mutations"
      - name: R276 clean quality dependency regression and mutation
        run: node scripts/r276-quality-dependency-mutations.cjs "$RUNNER_TEMP/r276-quality-dependency-mutations"
      - name: Verify sweep evidence rejects missing samples
        run: python3 scripts/r276-sweep-summary.test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r276-test-capture-and-fixture-proof
          path: |
            ${{ runner.temp }}/browser-cleanup-audit.json
            ${{ runner.temp }}/r276-cleanup-mutations/**
            ${{ runner.temp }}/r276-api-policy-mutations/**
            ${{ runner.temp }}/test-capture-audit.json
            ${{ runner.temp }}/r276-fixture-mutations/**
            ${{ runner.temp }}/r276-hexdata-mutations/**
            ${{ runner.temp }}/r276-legacy-installer-retry-mutations/**
            ${{ runner.temp }}/r276-port-owner-mutations/**
            ${{ runner.temp }}/r276-powershell-fixture-mutations/**
            ${{ runner.temp }}/r276-fresh-chrome-mutations/**
            ${{ runner.temp }}/r276-installed-demo-mutations/**
            ${{ runner.temp }}/r276-recovery-scope-mutations/**
            ${{ runner.temp }}/r276-translation-fixture-mutations/**
            ${{ runner.temp }}/r276-hexdata-stress-mutations/**
            ${{ runner.temp }}/r276-filter-geometry-mutations/**
            ${{ runner.temp }}/r276-update-probe-mutations/**
            ${{ runner.temp }}/r276-quality-dependency-mutations/**
          if-no-files-found: error
      - name: Vet
        run: go vet ./...
      - name: Verify release license isolation
        shell: bash
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags= -buildvcs=false -o "$RUNNER_TEMP/r233-release-public.exe" ./backend
          node desktop/verify-license-release.cjs "$RUNNER_TEMP/r233-release-public.exe"
      - name: R252 compile shelved license code and verify corrected fixtures
        run: node scripts/r252-license-check.cjs
      - name: R265 actual license embedded asset inventory guard
        run: go test ./backend -tags=license -run '^TestR265AllReleaseEmbeddedAssets$' -count=1
      - name: R272 synthetic overview wire budget guard
        run: go test ./backend -run '^TestR272SyntheticOverviewWireBudget$' -count=1
      - name: Verify CI test filters
        run: node scripts/verify-ci-test-filters.cjs
      - name: Test with race detector
        run: node scripts/r276-offline.cjs -- go test -count=1 -race ./...
      - name: Validate frontend JavaScript
        run: |
          node --check backend/web/app.js
          node --check backend/web/suite.js
          node --check desktop/main.cjs
      - name: Install desktop test dependencies
        run: npm ci --prefix desktop
      # Option B: measure this runner's speed with a fixed jsdom workload before
      # and after the suite, so the 192s margin is judged at reference speed.
      - name: Calibrate runner speed before renderers
        run: node scripts/runner-calibration.cjs "$RUNNER_TEMP/runner-calibration-before.json"
      - name: Test frontend and desktop renderers
        env:
          R222_NODE_TIMING_OUTPUT: ${{ runner.temp }}/renderer-timings-linux.json
        run: node scripts/test-renderers.cjs all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-timings-linux
          path: ${{ runner.temp }}/renderer-timings-linux.json
      - name: Calibrate runner speed after renderers
        run: node scripts/runner-calibration.cjs "$RUNNER_TEMP/runner-calibration-after.json"
      - name: Enforce R252 renderer budget margin
        run: node scripts/renderer-budget-gate.cjs "$RUNNER_TEMP/renderer-timings-linux.json" "$RUNNER_TEMP/runner-calibration-before.json" "$RUNNER_TEMP/runner-calibration-after.json" "$RUNNER_TEMP/renderer-budget-gate.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-budget-gate-linux
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/runner-calibration-before.json
            ${{ runner.temp }}/runner-calibration-after.json
            ${{ runner.temp }}/renderer-budget-gate.json
      - name: Test Riot relay Worker
        run: node --test relay/riot-worker/*.test.mjs
      - name: Test installer module
        working-directory: installer
        run: go test ./...
      - name: Vet installer module
        working-directory: installer
        run: go vet ./...

  # R277 proofs have their own VMs/steps, outside all existing calibrated shards.
  # No retired special-branch acceptance condition is reintroduced.
  r277-proof-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent R277 test dependencies
        run: npm ci --prefix desktop
      - name: Prepare R277 backend Go dependencies
        run: go mod download
      - name: Verify R277 orchestration and unchanged legacy budgets
        run: node --test scripts/r277-ci-orchestration.test.cjs
      - name: R277 CI branch-condition actual mutations
        if: ${{ !cancelled() }}
        run: node scripts/r277-ci-branch-mutations.cjs docs/history/reports/r277/ci-integration/linux/branch-mutations
      - name: R277 P1 fixed and actual mutations
        if: ${{ !cancelled() }}
        run: python scripts/r277-client-mutations.py --out docs/history/reports/r277/ci-integration/linux/p1
      - name: R277 real HTTP reread actual mutation
        if: ${{ !cancelled() }}
        run: python scripts/r277-http-refresh-proof.py --out docs/history/reports/r277/ci-integration/linux/http-reread
      - name: R277 P9 P10 fixed and actual mutations
        if: ${{ !cancelled() }}
        run: python scripts/r277-wire-diagnostic-mutations.py --out docs/history/reports/r277/ci-integration/linux/p9-p10
      - name: R277 Riot fixed and actual mutations
        if: ${{ !cancelled() }}
        run: python scripts/r277-riot-proof.py --out docs/history/reports/r277/ci-integration/linux/riot
      - name: R277 credential scope actual mutations
        if: ${{ !cancelled() }}
        run: python scripts/r277-riot-scope-proof.py --out docs/history/reports/r277/ci-integration/linux/riot-scope
      - name: R277 frontend and release contracts
        if: ${{ !cancelled() }}
        run: node scripts/r277-ci-orchestrate.cjs contracts --out docs/history/reports/r277/ci-integration/linux/frontend
      - name: R277 initial asset budget and actual deferred asset mutations
        if: ${{ !cancelled() }}
        run: node scripts/r277-ci-orchestrate.cjs deferred-unit --out docs/history/reports/r277/ci-integration/linux/deferred-assets
      - name: R277 CN score actual backend and frontend mutations
        if: ${{ !cancelled() }}
        run: node scripts/r277-ci-cn-score.cjs mutants --out docs/history/reports/r277/ci-integration/linux/cn-score
      - name: R277 frontend actual unit mutations
        if: ${{ !cancelled() }}
        run: node scripts/r277-ci-orchestrate.cjs frontend-mutants --out docs/history/reports/r277/ci-integration/linux/frontend
      - name: R279 failure triage (facts only, never changes the result)
        if: failure()
        shell: bash
        run: node scripts/ci-failure-triage.cjs --job r277-proof-linux --base origin/main --evidence "docs/history/reports/r277/ci-integration/linux" --out "docs/history/reports/r277/ci-integration/linux/triage.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r277-independent-linux-proof
          path: docs/history/reports/r277/ci-integration/linux/**
          if-no-files-found: error

  r277-native-windows:
    runs-on: windows-latest
    env:
      GODEBUG: invalidptr=1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require native Windows race compiler
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            $compiler = @('C:\mingw64\bin', 'C:\msys64\mingw64\bin') | Where-Object { Test-Path (Join-Path $_ 'gcc.exe') } | Select-Object -First 1
            if (-not $compiler) { throw 'Windows race compiler is unavailable' }
            $compiler | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Prepare native R277 Go dependencies
        shell: pwsh
        run: |
          go mod download
          if ($LASTEXITCODE -ne 0) { throw 'R277 backend dependencies failed' }
          Push-Location installer
          try {
            go mod download
            if ($LASTEXITCODE -ne 0) { throw 'R277 installer dependencies failed' }
          } finally { Pop-Location }
      - name: Measure every native R277 Go test including reopen and L5
        shell: pwsh
        run: |
          python scripts/r277-ci-proof.py --out docs/history/reports/r277/ci-integration/native-windows/go-measurements
          if ($LASTEXITCODE -ne 0) { throw 'Native R277 Go measurement or pass inventory failed' }
      - name: R277 P11 native fixed PASS and both old-pointer fatal mutations
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python scripts/r277-installer-callbacks.py --native --out docs/history/reports/r277/ci-integration/native-windows/p11
          if ($LASTEXITCODE -ne 0) { throw 'P11 native callback race/GC regression or fatal mutation proof failed' }
      - name: R279 failure triage (facts only, never changes the result)
        if: failure()
        shell: bash
        run: node scripts/ci-failure-triage.cjs --job r277-native-windows --base origin/main --evidence "docs/history/reports/r277/ci-integration/native-windows" --out "docs/history/reports/r277/ci-integration/native-windows/triage.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r277-native-windows-proof
          path: docs/history/reports/r277/ci-integration/native-windows/**
          if-no-files-found: error

  r277-browser-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      R277_MEASURE_ONLY: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install independent R277 browser dependencies
        run: npm ci --prefix desktop
      - name: Prepare independent R277 browser backend
        shell: bash
        run: node scripts/r277-ci-orchestrate.cjs build-browser --backend "$RUNNER_TEMP/r277-browser-public.exe" --out "docs/history/reports/r277/ci-integration/browser-${{ matrix.os }}"
      - name: R277 strict real-browser geometry and 400-match matrix
        id: r277_strict
        shell: bash
        run: node scripts/r277-ci-orchestrate.cjs browser --backend "$RUNNER_TEMP/r277-browser-public.exe" --out "docs/history/reports/r277/ci-integration/browser-${{ matrix.os }}"
      - name: R277 actual deferred asset loading CSP cache and 503 recovery
        if: ${{ !cancelled() }}
        shell: bash
        run: node scripts/r277-ci-orchestrate.cjs deferred-browser --backend "$RUNNER_TEMP/r277-browser-public.exe" --out "docs/history/reports/r277/ci-integration/browser-${{ matrix.os }}/deferred-assets"
      - name: R277 actual CN score browser to Go HTTP transport
        if: ${{ !cancelled() }}
        shell: bash
        run: node scripts/r277-ci-cn-score.cjs browser --backend "$RUNNER_TEMP/r277-browser-public.exe" --out "docs/history/reports/r277/ci-integration/browser-${{ matrix.os }}/cn-score"
      # R279: mutations only mean something when the base strict step passed; otherwise a base failure would be
      # reported a second time as a "wrong failure" of every mutant. Skipped (not red) when the base step failed.
      - name: R277 actual browser mutations
        if: ${{ !cancelled() && steps.r277_strict.outcome == 'success' }}
        shell: bash
        run: node scripts/r277-ci-orchestrate.cjs browser-mutants --backend "$RUNNER_TEMP/r277-browser-public.exe" --out "docs/history/reports/r277/ci-integration/browser-${{ matrix.os }}"
      - name: R277 Windows same-400-match before-after long-task measurement
        if: matrix.os == 'windows-latest'
        shell: bash
        run: node scripts/r277-perf-compare.cjs --backend "$RUNNER_TEMP/r277-browser-public.exe" --out "docs/history/reports/r277/ci-integration/browser-${{ matrix.os }}/p9-before-after"
      - name: Clean only R277 browser generated executable and dedicated Go cache
        if: always()
        shell: bash
        run: node scripts/r277-ci-orchestrate.cjs cleanup-browser --backend "$RUNNER_TEMP/r277-browser-public.exe" --out "docs/history/reports/r277/ci-integration/browser-${{ matrix.os }}"
      - name: R279 failure triage (facts only, never changes the result)
        if: failure()
        shell: bash
        run: node scripts/ci-failure-triage.cjs --job r277-browser-matrix-${{ matrix.os }} --base origin/main --evidence "docs/history/reports/r277/ci-integration/browser-${{ matrix.os }}" --out "docs/history/reports/r277/ci-integration/browser-${{ matrix.os }}/triage.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r277-browser-proof-${{ matrix.os }}
          path: docs/history/reports/r277/ci-integration/browser-${{ matrix.os }}/**
          if-no-files-found: error

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # R265 verifies the exact published 079 tag resource in memory.
      - name: R261 normal-close window bounds regression and assertion mutation
        shell: pwsh
        run: ./scripts/r261-window-bounds.test.ps1
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Verify local notes and assistant instructions are not tracked
        run: node scripts/verify-no-docs-tracked.cjs
      - name: Prepare verified published update compatibility input
        run: node scripts/prepare-r238-update-fixture.cjs
      - name: Install Windows test dependencies
        run: npm ci --prefix desktop
      # Audit unchanged production source on the fresh native runtime, before
      # Go/build fixtures create processes and replace npm dependencies.
      - name: Real default Electron first-frame license absence audit
        shell: pwsh
        env:
          R248_ELECTRON_OUTPUT: ${{ runner.temp }}/deep-legends-r238-default-electron
        run: |
          node -e "require('./scripts/r248-electron.cjs').probe({phase:'after',state:'DISABLED',frontendAssetDirectory:'default',storedBounds:{x:40,y:40,width:1050,height:750,maximized:false}}).then(r=>console.log(JSON.stringify(r.shows))).catch(e=>{console.error(e);process.exitCode=1})"
          if ($LASTEXITCODE -ne 0) { throw "Default first-frame audit failed" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r238-default-electron-windows
          path: ${{ runner.temp }}/deep-legends-r238-default-electron/**
      - name: Build desktop client and checksums
        shell: pwsh
        run: |
          $version = node -p "require('./desktop/package.json').version"
          if ($LASTEXITCODE -ne 0) { throw "Unable to read desktop package version" }
          $fakeCipher = (& go run ./backend -encrypt-riot-key 'RGAPI-00000000-0000-0000-0000-000000000000').Trim()
          if ($LASTEXITCODE -ne 0 -or -not $fakeCipher) { throw "Fake key encryption failed" }
          ./build-desktop-windows.ps1 -Version $version -KeyMode public -SkipTestsInCI -RiotAPIKeyCipher $fakeCipher
          if ($LASTEXITCODE -ne 0) { throw "Desktop build failed" }
          $env:DEEP_LEGENDS_KEY_MODE='public'
          node desktop/verify-embedded-riot-key.cjs --expect-fake
          if ($LASTEXITCODE -ne 0) { throw "Fake embedded key verification failed" }
      - name: Verify checksums
        shell: pwsh
        run: |
          Get-Content dist/desktop/SHA256SUMS-public.txt | ForEach-Object {
            $parts = $_ -split '  ', 2
            $actual = (Get-FileHash -Algorithm SHA256 (Join-Path dist/desktop $parts[1])).Hash.ToLowerInvariant()
            if ($actual -ne $parts[0]) { throw "Checksum mismatch: $($parts[1])" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: deep-legends-windows-x64
          path: |
            dist/desktop/*.exe
            dist/desktop/*.zip
            dist/desktop/SHA256SUMS-public.txt
          if-no-files-found: error

  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install desktop test dependencies
        run: npm ci --prefix desktop
      - name: Prepare verified published update compatibility input
        run: node scripts/prepare-r238-update-fixture.cjs
      # R225: restore all Windows-compiled shared paths, not only Linux skips.
      # Includes TestUpdate*, TestR204KeySaveAndClear, TestR204KeyRuntime401AndPrivacy
      # and TestSplitRegistryPathSupportsNativeTencentKeys. JSON proves actual passes.
      - name: Prepare backend Go dependencies before offline tests
        run: go mod download
      - name: Prepare installer Go dependencies before offline tests
        working-directory: installer
        run: go mod download
      - name: Test full Windows backend and installer suites
        shell: pwsh
        run: |
          $env:R276_OFFLINE_OUTPUT="$env:RUNNER_TEMP/r276-backend-offline.json"
          node scripts/r276-offline.cjs -- node scripts/run-ci-tests.cjs go backend
          if ($LASTEXITCODE -ne 0) { throw "Windows backend tests or pass inventory failed" }
          $env:R276_OFFLINE_OUTPUT="$env:RUNNER_TEMP/r276-installer-offline.json"
          node scripts/r276-offline.cjs -- node scripts/run-ci-tests.cjs go installer
          if ($LASTEXITCODE -ne 0) { throw "Windows installer tests or pass inventory failed" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r276-windows-offline-proof
          path: ${{ runner.temp }}/r276-*-offline.json
          if-no-files-found: error
      - name: R252 thirty independent R104 cold-start timelines
        shell: pwsh
        run: |
          go test -c -o "$env:RUNNER_TEMP/r252-r104.test.exe" ./backend
          if ($LASTEXITCODE -ne 0) { throw "R104 soak compilation failed" }
          python scripts/r252-r104-soak.py --binary "$env:RUNNER_TEMP/r252-r104.test.exe" --output "$env:RUNNER_TEMP/r252-r104-windows" --iterations 30
          if ($LASTEXITCODE -ne 0) { throw "R104 soak failure; original timelines retained" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r252-r104-windows
          path: ${{ runner.temp }}/r252-r104-windows/**
      - name: R252 native diagnostic timestamp regression and assertion mutation
        shell: pwsh
        run: ./scripts/r252-diagnostic-time.test.ps1
      # Filtered platform gates must match their exact counts with zero skips.
      - name: Test Windows-only release and PowerShell guards
        shell: pwsh
        env:
          R82_POWERSHELL: powershell.exe
        run: |
          node scripts/run-ci-tests.cjs node --expected-tests=2 --test-name-pattern="R86 Windows release|R222 Windows" desktop/release-quality-gates.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "Windows release gates failed" }
          node scripts/run-ci-tests.cjs node --expected-tests=1 --test-name-pattern="setup-only Windows CI skip" scripts/setup-only-build.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "Windows setup-only guards failed" }
          node scripts/run-ci-tests.cjs node --expected-tests=2 scripts/r82-startup-ab-script.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "PowerShell script guards failed" }
      # Release branch pushes measure Windows;
      # dispatch retains its explicit, default-true input.
      - name: Measure full desktop renderer tests on Windows
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/release-')) || (github.event_name == 'workflow_dispatch' && inputs.measure_windows_renderers)
        shell: pwsh
        env:
