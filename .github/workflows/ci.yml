  # R279: facts-only digest of the failed steps of the hash-pinned legacy jobs (their definitions stay untouched).
  # Failed-step log excerpts become check-run annotations and an artifact; this job can never fail the run.
  triage-legacy:
    if: ${{ always() && !cancelled() && (needs.quality.result == 'failure' || needs.windows-build.result == 'failure' || needs.windows-tests.result == 'failure' || needs.windows-upgrade.result == 'failure' || needs.browser-main.result == 'failure' || needs.browser-r265.result == 'failure' || needs.mutations-1.result == 'failure' || needs.mutations-2.result == 'failure' || needs.mutations-3.result == 'failure') }}
    needs: [quality, windows-build, windows-tests, windows-upgrade, browser-main, browser-r265, mutations-1, mutations-2, mutations-3]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: R279 failed-step digest (facts only, never changes the result)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          dir="$RUNNER_TEMP/triage"; mkdir -p "$dir"; : > "$dir/failed.log"
          api="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs"
          gh api "$api" --paginate --jq '.jobs[] | select(.conclusion=="failure") | .id' > "$dir/jobs.txt" 2> "$dir/gh-error.txt"
          gh api "$api" --paginate --jq '.jobs[] | select(.conclusion=="failure") | .name as $j | .steps[] | select(.conclusion=="failure") | "\($j) / \(.name)"' 2>> "$dir/gh-error.txt" | head -20 | sed 's/^/::notice title=failed step::/'
          for id in $(cat "$dir/jobs.txt"); do
            curl -sSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/$id/logs" 2>> "$dir/gh-error.txt" | sed -E 's/^[^0-9]*[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z //' >> "$dir/failed.log"
          done
          node scripts/ci-failure-triage.cjs --job legacy --base origin/main --log "$dir/failed.log" --out "$dir/triage-legacy.json" --annotate
          echo "::notice title=digest input::failed jobs=$(wc -l < "$dir/jobs.txt") log bytes=$(wc -c < "$dir/failed.log") log lines=$(wc -l < "$dir/failed.log") first api error=$(head -c 160 "$dir/gh-error.txt" | tr '\n' ' ')"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: triage-legacy
          if-no-files-found: ignore
          path: ${{ runner.temp }}/triage/**
