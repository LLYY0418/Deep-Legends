name: R317 published old-client proof
on:
  workflow_dispatch:
    inputs:
      expected_fingerprint:
        description: "Frozen 0.13.7 fingerprint"
        type: string
        required: true
permissions:
  contents: read
jobs:
  old-client:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and install actual published 0.13.6
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $out="$env:RUNNER_TEMP/r319-published";New-Item -ItemType Directory -Force $out|Out-Null
          gh release download v0.13.6 --pattern '*public.exe' --pattern latest.json --dir $out
          if($LASTEXITCODE -ne 0){throw 'actual old release download failed'}
          $manifest=Get-Content "$out/latest.json" -Raw|ConvertFrom-Json
          $setup=(Get-ChildItem "$out/*.exe").FullName
          @{version=$manifest.version;sha256=(Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant();size=(Get-Item $setup).Length}|ConvertTo-Json|Set-Content "$out/old-setup-integrity.json"
          if($manifest.version -ne '0.13.6' -or $manifest.asset.sha256 -ne '20293a28f76b5ef4cddeb47d3dd3b0e1aec37526855dca03dc8bd73dbf67a836' -or (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant() -ne $manifest.asset.sha256){throw 'published old Setup integrity mismatch'}
          $install="$out/installed";New-Item -ItemType Directory -Force $install|Out-Null
          $env:LOL_LOOT_DATA_DIR="$out/initial-data";$env:WEBVIEW2_USER_DATA_FOLDER="$out/initial-profile"
          New-Item -ItemType Directory -Force $env:LOL_LOOT_DATA_DIR|Out-Null
          @{automatic=$false;autoDownload=$false;mirrors=@('');preferredSource=''}|ConvertTo-Json|Set-Content "$env:LOL_LOOT_DATA_DIR/update-settings.json" -Encoding utf8
          $p=Start-Process $setup -ArgumentList "--update --dest `"$install`"" -PassThru
          if(-not $p.WaitForExit(180000)){Stop-Process -Id $p.Id -Force;throw 'old install timeout'};$p.WaitForExit();if($p.ExitCode -ne 0){throw 'old install failed'}
          Get-CimInstance Win32_Process|Where-Object{$_.ExecutablePath -and $_.ExecutablePath.StartsWith($install,[StringComparison]::OrdinalIgnoreCase)}|ForEach-Object{Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue}
          if((Get-Item "$install/Deep Legends.exe").VersionInfo.FileVersion -ne '0.13.6'){throw 'wrong installed old client'}
      - name: Real old UI detects public 0.13.7 without intercepted responses
        env:
          R317_EXPECTED_FINGERPRINT: ${{ inputs.expected_fingerprint }}
        shell: pwsh
        run: |
          node scripts/r319-published-detect.cjs "$env:RUNNER_TEMP/r319-published/installed/Deep Legends.exe" "$env:RUNNER_TEMP/r319-published/proof"
          if($LASTEXITCODE -ne 0){throw 'actual old UI did not detect public 0.13.7; do not retry'}
          $newPayloads=@(Get-ChildItem "$env:RUNNER_TEMP/r319-published/initial-data","$env:RUNNER_TEMP/r319-published/proof/data" -Recurse -File|Where-Object{$_.Name -match '\.(exe|part)$'})
          if($newPayloads.Count -ne 0){throw 'unexpected new installer payload; stop'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r319-published-proof-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/r319-published/old-setup-integrity.json
            ${{ runner.temp }}/r319-published/proof/*.json
            ${{ runner.temp }}/r319-published/proof/*.png
          if-no-files-found: error
