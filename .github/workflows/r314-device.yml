name: R315 Windows native development proof
on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Frozen candidate source ref
        type: string
        required: true
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref }}
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: candidate/desktop/package-lock.json
      - name: Install candidate dependencies
        working-directory: candidate
        run: npm ci --prefix desktop
      - name: Build static runtime native module and inspect dumpbin dependencies
        working-directory: candidate
        run: node desktop/build-resize-border.cjs
      - name: Native fallback unit contracts
        working-directory: candidate
        run: node --test desktop/resize-border.test.cjs
      - name: Real Electron load, idempotence and fallback renderer
        shell: pwsh
        run: |
          node scripts/r315-native-probe.cjs "$pwd/candidate" "$env:RUNNER_TEMP/r315-native"
          if ($LASTEXITCODE -ne 0) { throw 'native development proof failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r315-native-development-${{ github.run_id }}
          path: ${{ runner.temp }}/r315-native/*.json
          if-no-files-found: error
