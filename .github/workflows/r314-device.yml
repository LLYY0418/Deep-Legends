name: R316 installer staged development measurement
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build production-shaped instrumented candidate
        shell: pwsh
        run: |
          $version=node -p "require('./desktop/package.json').version"
          $fakeCipher=(& go run ./backend -encrypt-riot-key 'RGAPI-00000000-0000-0000-0000-000000000000').Trim()
          ./build-desktop-windows.ps1 -Version $version -KeyMode public -SkipTestsInCI -RiotAPIKeyCipher $fakeCipher
          if($LASTEXITCODE -ne 0){throw 'build failed'}
      - name: Windows installer unit and integration contracts
        working-directory: installer
        run: go test ./...
      - name: Real hidden standby ten signal-to-ACK samples and exit paths
        shell: pwsh
        run: |
          $profile="$env:RUNNER_TEMP/r316-timing/standby-profile";$env:WEBVIEW2_USER_DATA_FOLDER=$profile
          go build -o "$env:RUNNER_TEMP/r316-standby-probe.exe" ./scripts/r316-standby-probe
          if($LASTEXITCODE -ne 0){throw 'probe build'}
          & "$env:RUNNER_TEMP/r316-standby-probe.exe" (Get-ChildItem 'dist/desktop/*Setup*-public.exe').FullName "$env:RUNNER_TEMP/r316-timing/standby"
          if($LASTEXITCODE -ne 0){throw 'standby actual 400ms/exit-path contract failed'}
          $deadline=[DateTime]::UtcNow.AddSeconds(10)
          do { $owned=@(Get-CimInstance Win32_Process|Where-Object{$_.Name -eq 'msedgewebview2.exe' -and $_.CommandLine -and $_.CommandLine.Contains($profile)});if($owned.Count -eq 0){break};Start-Sleep -Milliseconds 100 } while([DateTime]::UtcNow -lt $deadline)
          if($owned.Count -ne 0){$owned|ConvertTo-Json|Set-Content "$env:RUNNER_TEMP/r316-timing/standby/orphans.json";throw 'standby left WebView processes'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r316-installer-timing-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/r316-timing/**/*.json
            ${{ runner.temp }}/r316-timing/**/*.log
            ${{ runner.temp }}/r316-timing/**/*.txt
          if-no-files-found: error
