name: Windows public release draft

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate release identity and prebuilt publication
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-draft.cjs prepare
      - uses: actions/setup-go@v5
        if: steps.release.outputs.skip != 'true'
        with:
          go-version: '1.24.13'
          cache: true
      - uses: actions/setup-node@v4
        if: steps.release.outputs.skip != 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Validate release version
        if: steps.release.outputs.skip != 'true'
        shell: powershell
        run: |
          $version = (& node -p "require('./desktop/package.json').version").Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid desktop package version" }
          $tag = "v$version"
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF -ne "refs/tags/$tag") {
            throw "Tag $env:GITHUB_REF does not match desktop package version $tag"
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
      - name: Build and verify public release
        if: steps.release.outputs.skip != 'true'
        shell: powershell
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RIOT_API_KEY)) { throw "Repository secret RIOT_API_KEY is required" }
          Write-Output "::add-mask::$env:RIOT_API_KEY"
          $riotCipher = (& go run ./backend -encrypt-riot-key env:RIOT_API_KEY).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $riotCipher) { throw "Riot key encryption failed" }
          Write-Output "::add-mask::$riotCipher"
          Remove-Item Env:RIOT_API_KEY
          & .\build-public-release-windows.ps1 -Version $env:RELEASE_VERSION -SkipTestsInCI -RiotAPIKeyCipher $riotCipher
          $riotCipher = $null
          if ($LASTEXITCODE -ne 0) { throw "Public release build failed" }
      - name: Upload verified release files
        if: steps.release.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: deep-legends-public-${{ github.sha }}
          path: |
            dist/release/Deep-Legends-Setup-${{ env.RELEASE_VERSION }}-public.exe
            dist/release/latest.json
            dist/release/SHA256SUMS-public.txt
          if-no-files-found: error
      - name: Create draft Release
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-draft.cjs create
      - name: Upload immutable build receipt
        if: steps.release.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-build-receipt-${{ github.sha }}
          path: dist/release-build-receipt.json
          if-no-files-found: error
