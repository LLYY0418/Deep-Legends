name: R312 real Windows resize measurements
on:
  push:
    branches: [codex/diagnostic-r279-r312-resize]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure real desktop
        shell: powershell
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::PrimaryScreen.Bounds | Out-String | Write-Output
      - name: Download exact published 0.13.0 package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.13.0 --pattern 'Deep-Legends-Setup-0.13.0-public.exe' --dir "$env:RUNNER_TEMP/r312-baseline"
          if ($LASTEXITCODE -ne 0) { throw 'Baseline download failed' }
          $setup="$env:RUNNER_TEMP/r312-baseline/Deep-Legends-Setup-0.13.0-public.exe"
          $hash=(Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'c1864cd6c805ba3321339e5893902566356f576fb7237c2c9b6baf17955a1070') { throw "Baseline hash mismatch: $hash" }
          $install="$env:RUNNER_TEMP/r312-app"
          New-Item -ItemType Directory -Force $install,"$env:RUNNER_TEMP/r312-evidence" | Out-Null
          $env:LOL_LOOT_DATA_DIR="$env:RUNNER_TEMP/r312-install-data"
          $env:RIOT_API_KEY='RGAPI-00000000-0000-0000-0000-000000000000'
          . ./scripts/r271-installer-diagnostics.ps1
          $started=Get-Date
          $process=Start-Process -FilePath $setup -ArgumentList "--update --dest `"$install`"" -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/r312-installer-stdout.log" -RedirectStandardError "$env:RUNNER_TEMP/r312-installer-stderr.log"
          $deadline=(Get-Date).AddSeconds(180)
          while (-not $process.WaitForExit(50)) {
            if ((Get-Date) -gt $deadline) {
              Save-R271SetupFailure -File $setup -Version '0.13.0' -Process $process -StartedAt $started -Prefix "$env:RUNNER_TEMP/r312-installer" -StartupLog "$env:TEMP/DeepLegendsSetup-startup.log"
              Stop-Process -Id $process.Id -Force
              throw 'Real Go installer timed out'
            }
          }
          $process.WaitForExit()
          if ($process.ExitCode -ne 0) { throw "Go installer failed: $($process.ExitCode)" }
          if (-not (Test-Path "$install/Deep Legends.exe")) { throw 'Installed application missing' }
          Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -and $_.ExecutablePath.StartsWith($install,[StringComparison]::OrdinalIgnoreCase) } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
      - name: Enable main-process inspection for native background audit only
        shell: pwsh
        run: |
          npm ci --prefix desktop
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic dependencies failed' }
          $root="$env:RUNNER_TEMP/r312-app"
          1..10 | ForEach-Object {
            Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -and $_.ExecutablePath.StartsWith($root,[StringComparison]::OrdinalIgnoreCase) } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            Start-Sleep -Milliseconds 200
          }
          Copy-Item "$root/Deep Legends.exe" "$root/Deep Legends Inspect.exe" -Force
          node -e "const f=require('./desktop/node_modules/@electron/fuses');f.flipFuses(process.argv[1],{version:f.FuseVersion.V1,[f.FuseV1Options.EnableNodeCliInspectArguments]:true}).catch(e=>{console.error(e);process.exitCode=1})" "$env:RUNNER_TEMP/r312-app/Deep Legends Inspect.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic inspect fuse failed' }
      - name: Measure baseline and individual resize candidates
        shell: pwsh
        run: |
          node scripts/r312-windows-resize.cjs "$env:RUNNER_TEMP/r312-app/Deep Legends Inspect.exe" "$env:RUNNER_TEMP/r312-evidence"
          if ($LASTEXITCODE -ne 0) { throw 'Native desktop measurement failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r312-real-windows-resize
          path: |
            ${{ runner.temp }}/r312-evidence/**
            "!${{ runner.temp }}/r312-evidence/**/user-data/**"
            "!${{ runner.temp }}/r312-evidence/**/backend-data/**"
            ${{ runner.temp }}/r312-installer-*
            ${{ runner.temp }}/DeepLegendsSetup-startup.log
          if-no-files-found: warn
